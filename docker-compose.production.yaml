version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    env_file: .env ## Change this file for customized env variables
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '8084:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      # Comes from POSTGRES_PASSWORD in .env - keep both in sync.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data

  # Optional: standalone WhatsApp bridge (QR code / multi-device, via
  # Baileys) used by the "WhatsApp (QR Code)" inbox channel. Not exposed
  # to the host - only "rails"/"sidekiq" talk to it, over the internal
  # Docker network, using WHATSAPP_QR_SERVICE_URL/WHATSAPP_QR_SERVICE_KEY
  # from .env. Safe to leave running unconfigured if that channel isn't used.
  whatsapp_qr:
    build:
      context: ./services/whatsapp-qr
    depends_on:
      - rails
    env_file: .env
    environment:
      - CHATWOOT_BASE_URL=http://rails:3000
      - API_KEY=${WHATSAPP_QR_SERVICE_KEY}
    volumes:
      - whatsapp_qr_auth:/app/auth
    restart: always

volumes:
  storage_data:
  postgres_data:
  redis_data:
  whatsapp_qr_auth:
